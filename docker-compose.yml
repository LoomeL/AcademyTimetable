  frontend:
    pull_policy: build
    build: 
      context: Frontend
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.academytimetable.rule=Host(`academy.loomel.ru`)
      - traefik.http.routers.academytimetable.tls=true
      - traefik.http.routers.academytimetable.tls.certresolver=letsencrypt
      - traefik.http.services.academytimetable.loadbalancer.server.port=80
    networks:
      - web-proxy
networks:
  web-proxy:
    external: true
